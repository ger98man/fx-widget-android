name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Ubuntu 24.04 image ships with the Android SDK preinstalled ($ANDROID_HOME)
    runs-on: ubuntu-24.04
    env:
      # Bump the first two numbers by hand; the last one is the build number
      APP_VERSION: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Name APK by version
        run: cp app/build/outputs/apk/debug/app-debug.apk "fx-widget-v${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: fx-widget-v${{ env.APP_VERSION }}
          path: fx-widget-v${{ env.APP_VERSION }}.apk
